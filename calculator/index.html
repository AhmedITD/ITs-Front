<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="calculator">
            <div class="header">
                <h1>Calculator</h1>
                <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
            </div>
            <div class="display-section">
                <div class="operation" id="operation"></div>
                <input type="text" id="display" placeholder="0" readonly>
            </div>
            <div class="buttons">
                <button class="btn btn-clear" onclick="clearDisplay()" title="Clear (C)">C</button>
                <button class="btn btn-operator" onclick="appendOperator('/')" title="Divide">/</button>
                <button class="btn btn-operator" onclick="appendOperator('*')" title="Multiply">*</button>
                <button class="btn btn-operator" onclick="deleteLast()" title="Delete (Backspace)">DEL</button>
                
                <button class="btn" onclick="appendNumber('7')">7</button>
                <button class="btn" onclick="appendNumber('8')">8</button>
                <button class="btn" onclick="appendNumber('9')">9</button>
                <button class="btn btn-operator" onclick="appendOperator('-')" title="Subtract">-</button>
                
                <button class="btn" onclick="appendNumber('4')">4</button>
                <button class="btn" onclick="appendNumber('5')">5</button>
                <button class="btn" onclick="appendNumber('6')">6</button>
                <button class="btn btn-operator" onclick="appendOperator('+')" title="Add">+</button>
                
                <button class="btn" onclick="appendNumber('1')">1</button>
                <button class="btn" onclick="appendNumber('2')">2</button>
                <button class="btn" onclick="appendNumber('3')">3</button>
                <button class="btn btn-function" onclick="appendPercent()" title="Percent">%</button>
                
                <button class="btn btn-zero" onclick="appendNumber('0')">0</button>
                <button class="btn btn-function" onclick="toggleSign()" title="Toggle sign">+/-</button>
                <button class="btn btn-function" onclick="appendSquareRoot()" title="Square root">√</button>
                <button class="btn btn-equals" onclick="calculate()">=</button>
                
                    <button class="btn btn-function" onclick="appendPower()" title="Power">x²</button>
            </div>
            <div class="history-section">
                <div class="history-header">
                    <h3>History</h3>
                    <button class="clear-history" onclick="clearHistory()" title="Clear history">×</button>
                </div>
                <div class="history" id="history"></div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
