<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <h1>🛒 Shopping Cart</h1>
                <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
            </div>
        </div>

        <div class="main-content">
            <!-- Products Section -->
            <div class="products-section">
                <h2>Available Products</h2>
                <div class="products-grid" id="productsGrid"></div>
            </div>

            <!-- Cart Section -->
            <div class="cart-section">
                <div class="cart-header">
                    <h2>Cart Items</h2>
                    <span class="cart-count" id="cartCount">0</span>
                </div>

                <div class="cart-items" id="cartItems">
                    <div class="empty-cart">
                        <p>Your cart is empty</p>
                        <p class="empty-hint">Add items from the products list</p>
                    </div>
                </div>

                <div class="cart-summary">
                    <div class="summary-row">
                        <span>Subtotal:</span>
                        <span id="subtotal">$0.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Tax (10%):</span>
                        <span id="tax">$0.00</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total:</span>
                        <span id="total">$0.00</span>
                    </div>
                    <div class="cart-actions">
                        <button class="btn btn-clear" onclick="clearCart()" title="Clear cart">Clear Cart</button>
                        <button class="btn btn-checkout" onclick="checkout()" title="Proceed to checkout">Checkout</button>
                    </div>
                </div>

                <!-- Order History -->
                <div class="history-section">
                    <div class="history-header">
                        <h3>Order History</h3>
                        <button class="clear-history" onclick="clearOrderHistory()" title="Clear history">×</button>
                    </div>
                    <div class="history" id="orderHistory"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
