<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rent-A-Ride Mini App</title>
    <script src="https://cdn.marmot-cloud.com/npm/hylid-bridge/2.10.0/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script>
      (function () {
        var isSuperQi = typeof my !== 'undefined';
        var NOT_SUPERQI = 'Must run inside SuperQi';

        function getApiBase() {
          return (window.__RENTARIDE_API_BASE__ || 'http://localhost:5022').replace(/\/$/, '');
        }

        var ENDPOINTS = {
          get authWithSuperQi() { return getApiBase() + '/auth/auth-with-superQi'; },
          get vehicles() { return getApiBase() + '/vehicles'; },
          get vehiclesTypes() { return getApiBase() + '/vehicles/types'; },
          get rentals() { return getApiBase() + '/rentals'; },
          get rentalsInvoice() { return getApiBase() + '/rentals/invoice'; },
          get rentalsMyHistory() { return getApiBase() + '/rentals/my-history'; },
          get amenities() { return getApiBase() + '/amenities'; },
          // SuperQi Alipay+ endpoints
          get superqiPaymentCreate() { return getApiBase() + '/api/superqi/payment/create'; },
          get superqiPaymentRefund() { return getApiBase() + '/api/superqi/payment/refund'; },
          get superqiNotificationInbox() { return getApiBase() + '/api/superqi/notification/inbox'; },
          get superqiNotificationPush() { return getApiBase() + '/api/superqi/notification/push'; },
          get superqiAgreementPrepare() { return getApiBase() + '/api/superqi/agreement/prepare'; },
          get superqiAgreementApplyToken() { return getApiBase() + '/api/superqi/agreement/apply-token'; },
          get superqiAgreementPay() { return getApiBase() + '/api/superqi/agreement/pay'; }
        };

        function formatSdkError(err, fallback) {
          if (!err) return fallback;
          var code = err.error !== undefined ? err.error : (err.errorCode !== undefined ? err.errorCode : err.code);
          var msg = err.errMsg !== undefined ? err.errMsg : (err.message !== undefined ? err.message : err.msg);
          if (code != null && msg) return fallback + ': [' + code + '] ' + msg;
          if (msg) return fallback + ': ' + msg;
          if (code != null) return fallback + ': code ' + code;
          return fallback;
        }

        function getAuthCode(opts) {
          var scopes = (opts && opts.scopes) || ['auth_base', 'USER_ID'];
          return new Promise(function (resolve, reject) {
            if (!isSuperQi) {
              reject(new Error(NOT_SUPERQI));
              return;
            }
            my.getAuthCode({
              scopes: scopes,
              success: function (res) {
                resolve({ code: res.authCode || res.code || '' });
              },
              fail: function (err) {
                reject(new Error(formatSdkError(err, 'getAuthCode failed')));
              }
            });
          });
        }

        function authWithSuperQi(token) {
          return fetch(ENDPOINTS.authWithSuperQi, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Pinggy-No-Screen': '1' },
            body: JSON.stringify({ token: token })
          }).then(function (res) {
            return res.json().then(function (body) {
              if (!res.ok) {
                var msg = body && (body.message || body.errors) ? (body.message || JSON.stringify(body.errors)) : 'Auth failed (' + res.status + ')';
                throw new Error(msg);
              }
              if (body && body.success && body.data) return body.data;
              return body;
            });
          }).catch(function (e) {
            if (e instanceof Error && e.message.indexOf('Auth failed') === 0) throw e;
            throw new Error('Auth request failed: ' + (e && (e.message || String(e))));
          });
        }

        function tradePayWithUrl(paymentUrl) {
          if (!isSuperQi) throw new Error(NOT_SUPERQI);
          if (!paymentUrl) throw new Error('Payment URL is required');
          return new Promise(function (resolve, reject) {
            my.tradePay({
              paymentUrl: paymentUrl,
              success: function (res) { resolve({ success: true, res: res }); },
              fail: function (err) { reject(new Error(formatSdkError(err, 'Payment failed'))); }
            });
          });
        }

        function alertBridge(msg) {
          if (isSuperQi && typeof my.alert === 'function') {
            my.alert({ title: 'Rent-A-Ride', content: String(msg) });
          } else {
            window.alert(msg);
          }
        }

        function allowSystemSnapshot() {}

        window.__RENTARIDE_BRIDGE__ = {
          getAuthCode: getAuthCode,
          isSuperQi: isSuperQi,
          authWithSuperQi: authWithSuperQi,
          tradePayWithUrl: tradePayWithUrl,
          alert: alertBridge,
          allowSystemSnapshot: allowSystemSnapshot,
          get API_BASE() { return getApiBase(); },
          get ENDPOINTS() { return ENDPOINTS; }
        };
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
